<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1630" style="background-color: white;">
  <!-- Titre -->
  <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Organigramme V3 - Communication Client/Serveur avec fork()</text>
  
  <!-- Acteurs -->
  <rect x="20" y="60" width="100" height="40" fill="#e0e0e0" stroke="#333" rx="5"/>
  <text x="70" y="85" text-anchor="middle" font-size="13" font-weight="bold">Client 1</text>
  
  <rect x="325" y="60" width="100" height="40" fill="#e0e0e0" stroke="#333" rx="5"/>
  <text x="375" y="85" text-anchor="middle" font-size="13" font-weight="bold">Serveur</text>
  
  <rect x="630" y="60" width="100" height="40" fill="#e0e0e0" stroke="#333" rx="5"/>
  <text x="680" y="85" text-anchor="middle" font-size="13" font-weight="bold">Client 2</text>
  
  <!-- Lignes verticales -->
  <line x1="70" y1="100" x2="70" y2="1630" stroke="#999" stroke-width="1"/>
  <line x1="375" y1="100" x2="375" y2="1630" stroke="#999" stroke-width="1"/>
  <line x1="680" y1="100" x2="680" y2="1630" stroke="#999" stroke-width="1"/>
  
  <!-- Phase d'initialisation serveur -->
  <rect x="240" y="130" width="270" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="375" y="152" text-anchor="middle" font-size="13" font-weight="bold">Phase d'initialisation serveur</text>
  
  <!-- Serveur : socket() -->
  <rect x="280" y="185" width="190" height="35" fill="#d4edda" stroke="#28a745" rx="3"/>
  <text x="375" y="207" text-anchor="middle" font-size="11">socket()</text>
  
  <!-- Serveur : bind() -->
  <rect x="280" y="235" width="190" height="35" fill="#d4edda" stroke="#28a745" rx="3"/>
  <text x="375" y="257" text-anchor="middle" font-size="11">bind()</text>
  
  <!-- Serveur : listen() -->
  <rect x="280" y="285" width="190" height="35" fill="#d4edda" stroke="#28a745" rx="3"/>
  <text x="375" y="307" text-anchor="middle" font-size="11">listen()</text>
  
  <!-- Serveur : accept() en attente -->
  <rect x="280" y="335" width="190" height="35" fill="#fff3cd" stroke="#ffc107" rx="3"/>
  <text x="375" y="357" text-anchor="middle" font-size="11">accept() - En attente Client 1</text>
  
  <!-- Phase d'initialisation client 1 -->
  <rect x="0" y="390" width="200" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="100" y="412" text-anchor="middle" font-size="12" font-weight="bold">Phase d'initialisation Client 1</text>
  
  <!-- Client 1 : socket() -->
  <rect x="10" y="440" width="180" height="35" fill="#d1ecf1" stroke="#17a2b8" rx="3"/>
  <text x="100" y="462" text-anchor="middle" font-size="11">socket()</text>
  
  <!-- Client 1 : connect() -->
  <line x1="70" y1="485" x2="375" y2="485" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="480" text-anchor="middle" font-size="11" fill="#333">1. connect()</text>
  
  <!-- Serveur : accept() Client 1 -->
  <rect x="280" y="495" width="190" height="35" fill="#d4edda" stroke="#28a745" rx="3"/>
  <text x="375" y="517" text-anchor="middle" font-size="11">accept() - Client 1 connecté</text>
  
  <!-- Serveur envoie message bienvenue -->
  <line x1="375" y1="550" x2="70" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="545" text-anchor="middle" font-size="11" fill="#333">2. Bienvenue joueur 1</text>
  
  <!-- Serveur : accept() en attente Client 2 -->
  <rect x="280" y="580" width="190" height="35" fill="#fff3cd" stroke="#ffc107" rx="3"/>
  <text x="375" y="602" text-anchor="middle" font-size="11">accept() - En attente Client 2</text>
  
  <!-- Phase d'initialisation client 2 -->
  <rect x="550" y="630" width="200" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="650" y="652" text-anchor="middle" font-size="12" font-weight="bold">Phase d'initialisation Client 2</text>
  
  <!-- Client 2 : socket() -->
  <rect x="560" y="680" width="180" height="35" fill="#d1ecf1" stroke="#17a2b8" rx="3"/>
  <text x="650" y="702" text-anchor="middle" font-size="11">socket()</text>
  
  <!-- Client 2 : connect() -->
  <line x1="680" y1="725" x2="375" y2="725" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="527" y="720" text-anchor="middle" font-size="11" fill="#333">3. connect()</text>
  
  <!-- Serveur : accept() Client 2 -->
  <rect x="280" y="735" width="190" height="35" fill="#d4edda" stroke="#28a745" rx="3"/>
  <text x="375" y="757" text-anchor="middle" font-size="11">accept() - Client 2 connecté</text>
  
  <!-- Serveur : fork() -->
  <rect x="240" y="785" width="270" height="50" fill="#f8d7da" stroke="#dc3545" rx="3"/>
  <text x="375" y="810" text-anchor="middle" font-size="13" font-weight="bold">fork() - Création processus enfant</text>
  <text x="375" y="825" text-anchor="middle" font-size="11">Le parent retourne à accept()</text>
  
  <!-- Processus enfant -->
  <rect x="240" y="850" width="270" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="375" y="872" text-anchor="middle" font-size="13" font-weight="bold">Processus enfant gère la partie</text>
  
  <!-- Serveur envoie message bienvenue Client 2 -->
  <line x1="375" y1="900" x2="680" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="527" y="895" text-anchor="middle" font-size="11" fill="#333">4. Bienvenue Client 2</text>
  
  <!-- Serveur demande mot à Client 1 -->
  <line x1="375" y1="935" x2="70" y2="935" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="930" text-anchor="middle" font-size="11" fill="#333">5. Entrez un mot</text>
  
  <!-- Client 1 envoie mot -->
  <line x1="70" y1="970" x2="375" y2="970" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="965" text-anchor="middle" font-size="11" fill="#333">6. Mot secret</text>
  
  <!-- Serveur envoie taille mot à Client 2 -->
  <line x1="375" y1="1005" x2="680" y2="1005" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="527" y="1000" text-anchor="middle" font-size="11" fill="#333">7. Taille du mot</text>
  
  <!-- Serveur envoie message à Client 1 -->
  <line x1="375" y1="1040" x2="70" y2="1040" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="1035" text-anchor="middle" font-size="11" fill="#333">8. Le joueur 2 devine</text>
  
  <!-- Boucle de jeu -->
  <rect x="25" y="1085" width="700" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="375" y="1107" text-anchor="middle" font-size="13" font-weight="bold">Boucle de jeu - relais des messages</text>
  
  <!-- Note Client 1 -->
  <rect x="0" y="1145" width="130" height="55" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="65" y="1165" text-anchor="middle" font-size="10">Client 1 vérifie</text>
  <text x="65" y="1180" text-anchor="middle" font-size="10">si lettre dans</text>
  <text x="65" y="1195" text-anchor="middle" font-size="10">le mot</text>
  
  <!-- Note Client 2 -->
  <rect x="620" y="1145" width="130" height="55" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="685" y="1165" text-anchor="middle" font-size="10">Client 2 affiche</text>
  <text x="685" y="1180" text-anchor="middle" font-size="10">statut mot,</text>
  <text x="685" y="1195" text-anchor="middle" font-size="10">erreurs, pendu</text>
  
  <!-- Boucle -->
  <rect x="15" y="1215" width="720" height="300" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
  <text x="35" y="1235" font-size="11" font-weight="bold">[Boucle jusqu'à fin de partie]</text>
  
  <!-- Client 2 envoie lettre -->
  <line x1="680" y1="1265" x2="375" y2="1265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="527" y="1260" text-anchor="middle" font-size="11" fill="#333">9. Lettre proposée</text>
  
  <!-- Serveur transite lettre -->
  <line x1="375" y1="1300" x2="70" y2="1300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="1295" text-anchor="middle" font-size="11" fill="#333">10. Transite la lettre</text>
  
  <!-- Client 1 envoie réponse -->
  <line x1="70" y1="1335" x2="375" y2="1335" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="222" y="1330" text-anchor="middle" font-size="11" fill="#333">11. Réponse formatée</text>
  <text x="222" y="1345" text-anchor="middle" font-size="10" fill="#666">status mot erreurs</text>
  
  <!-- Serveur transite réponse -->
  <line x1="375" y1="1380" x2="680" y2="1380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="527" y="1375" text-anchor="middle" font-size="11" fill="#333">12. Transite la réponse</text>
  
  <!-- Fin de partie -->
  <rect x="25" y="1535" width="700" height="35" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="375" y="1557" text-anchor="middle" font-size="13" font-weight="bold">Fin de partie</text>
  
  <!-- Client 1 close() -->
  <rect x="10" y="1585" width="120" height="30" fill="#d1ecf1" stroke="#17a2b8" rx="3"/>
  <text x="70" y="1605" text-anchor="middle" font-size="11">13. close()</text>
  
  <!-- Client 2 close() -->
  <rect x="620" y="1585" width="120" height="30" fill="#d1ecf1" stroke="#17a2b8" rx="3"/>
  <text x="680" y="1605" text-anchor="middle" font-size="11">13. close()</text>
  
  <!-- Note processus enfant -->
  <rect x="265" y="1570" width="220" height="40" fill="#fff5ad" stroke="#666" rx="3"/>
  <text x="375" y="1590" text-anchor="middle" font-size="10">Processus enfant se termine</text>
  <text x="375" y="1605" text-anchor="middle" font-size="10">Le parent accepte nouvelles parties</text>
  
  <!-- Définition de la flèche -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
